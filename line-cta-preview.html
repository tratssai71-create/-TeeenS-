<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LINE CTA Preview</title>
<style>body{margin:0;background:#f4f4f4;font-family:sans-serif}.page{max-width:412px;margin:0 auto;background:#fff;min-height:200vh;padding:24px 16px;color:#333}</style>
</head><body>
<div class="page"><h1>プレビュー</h1><p>右下にLINE CTAが固定表示されます。スクロールしても追従します。</p></div>
<!-- ===== 右下固定 LINE CTA（Studio埋め込み用） ===== -->
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@700;900&display=swap" rel="stylesheet">
<style>
  .hm-fcta, .hm-fcta * { box-sizing:border-box; margin:0; padding:0; }
  .hm-fcta {
    position:fixed;
    right:max(12px, calc((100vw - 412px) / 2 + 12px));
    bottom:calc(16px + env(safe-area-inset-bottom));
    z-index:9990;
    display:flex; flex-direction:column; align-items:flex-end;
    text-decoration:none;
    font-family:"Noto Sans JP",sans-serif;
    -webkit-tap-highlight-color:transparent;
  }
  .hm-fcta-balloon {
    position:relative; margin-right:34px; margin-bottom:10px;
    background:#fff; color:#121212;
    border:3px solid #121212; border-radius:14px;
    padding:9px 14px;
    font:900 15px/1.2 "Noto Sans JP",sans-serif;
    white-space:nowrap;
  }
  .hm-fcta-balloon em { font-style:normal; color:#06C755; }
  .hm-fcta-balloon::after {
    content:""; position:absolute; right:22px; bottom:-11px;
    border:9px solid transparent; border-top:10px solid #121212; border-bottom:0;
  }
  .hm-fcta-btn {
    width:112px; height:112px; border-radius:50%;
    background:#5BC766;
    border:4px solid #121212;
    box-shadow:inset 0 0 0 4px #fff, 0 6px 14px rgba(0,0,0,.2);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;
    transition:transform .15s;
  }
  .hm-fcta:active .hm-fcta-btn { transform:scale(.95); }
  .hm-fcta-btn svg { width:44px; height:38px; display:block; }
  .hm-fcta-btn span { font:900 16px/1 "Noto Sans JP",sans-serif; color:#fff; }
</style>

<!-- href をLINE友だち追加URLに差し替え -->
<a class="hm-fcta" href="https://lin.ee/XXXXXXX" target="_blank" rel="noopener" aria-label="LINEで相談する（友だち追加）">
  <span class="hm-fcta-balloon">まずは<em>LINE</em>で相談</span>
  <span class="hm-fcta-btn">
    <svg viewBox="0 0 44 38" aria-hidden="true">
      <path fill="#fff" d="M22 1C10.4 1 1 8.2 1 17.1c0 7.9 7.4 14.5 17.4 15.8.7.1 1.6.4 1.8 1 .2.5.1 1.3.1 1.8l-.3 1.8c-.1.5-.4 2 1.8 1.1 2.2-.9 12-7 16.4-12.1C41.6 23.6 43 20.4 43 17.1 43 8.2 33.6 1 22 1z"/>
      <text x="22" y="21.5" text-anchor="middle" font-family="Arial,sans-serif" font-weight="900" font-size="10" fill="#5BC766">LINE</text>
    </svg>
    <span>友だち追加</span>
  </span>
</a>
</body></html>
