<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>送信完了 | 株式会社TeeenS</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Noto+Sans+JP:wght@300;400;500;700;900&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--ink:#09090b;--ink2:rgba(9,9,11,.55);--ink3:rgba(9,9,11,.3);--bd:rgba(9,9,11,.08);--ac:#6366f1}
html,body{height:100%}
body{font-family:'Inter','Noto Sans JP',sans-serif;color:var(--ink);background:#fff;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:40px 24px;text-align:center}
a{text-decoration:none;color:inherit}

.tk-icon{
  width:72px;height:72px;border-radius:50%;background:#f0fdf4;
  display:flex;align-items:center;justify-content:center;
  margin:0 auto 28px;
}
.tk-icon svg{width:36px;height:36px;stroke:#22c55e;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}

.tk-title{
  font-size:clamp(24px,5vw,36px);font-weight:900;
  letter-spacing:-0.03em;line-height:1.2;margin-bottom:16px;
}
.tk-lead{
  font-size:15px;color:var(--ink2);line-height:1.9;
  max-width:420px;margin:0 auto 40px;
}

.tk-btns{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.tk-btn-primary{
  display:inline-flex;align-items:center;gap:8px;
  background:var(--ink);color:#fff;
  font-size:14px;font-weight:700;padding:14px 32px;
  letter-spacing:.04em;border-radius:4px;
  transition:background .2s;
}
.tk-btn-primary:hover{background:#333}
.tk-btn-ghost{
  display:inline-flex;align-items:center;gap:8px;
  border:1.5px solid var(--bd);color:var(--ink2);
  font-size:14px;font-weight:600;padding:14px 28px;
  border-radius:4px;transition:border-color .2s,color .2s;
}
.tk-btn-ghost:hover{border-color:var(--ink);color:var(--ink)}

.tk-note{
  margin-top:48px;font-size:12px;color:var(--ink3);line-height:1.8;
}
</style>
</head>
<body>

<div class="tk-icon">
  <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
</div>

<h1 class="tk-title">お問い合わせ<br>ありがとうございます</h1>
<p class="tk-lead">内容を確認のうえ、担当者より2〜3営業日以内にご連絡いたします。<br>しばらくお待ちください。</p>

<div class="tk-btns">
  <a href="/" class="tk-btn-primary">トップページへ →</a>
  <a href="/works" class="tk-btn-ghost">制作実績を見る</a>
</div>

<p class="tk-note">
  万が一、返信がない場合はお手数ですが<br>
  再度お問い合わせいただくか、直接ご連絡ください。
</p>

</body>
</html>
