<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QRコード — teeen-s.com</title>
<style>
body{margin:0;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;font-family:sans-serif;gap:20px}
canvas{display:block}
p{font-size:15px;color:#555;margin:0}
button{padding:12px 32px;background:#09090b;color:#fff;border:none;font-size:15px;cursor:pointer;border-radius:6px}
</style>
</head>
<body>
<canvas id="qrc"></canvas>
<p>https://teeen-s.com</p>
<button onclick="dl()">画像を保存</button>
<script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
<script>
var c=document.getElementById('qrc');
QRCode.toCanvas(c,'https://teeen-s.com',{width:600,margin:3,color:{dark:'#09090b',light:'#ffffff'},errorCorrectionLevel:'H'},function(){
  c.style.width='300px';c.style.height='300px';
});
function dl(){
  var a=document.createElement('a');
  a.href=document.getElementById('qrc').toDataURL('image/png');
  a.download='teeen-s-qrcode.png';
  a.click();
}
</script>
</body>
</html>
